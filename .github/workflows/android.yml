name: Build Android APK

on:
  push:
    paths:
      - 'android/**'
      - 'public/**'
      - 'shared/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write # to publish the APK as a GitHub Release

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run joy-filter tests
        run: npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Optional: sign with your own private key. Add these repository secrets
      # (Settings → Secrets and variables → Actions) to enable it:
      #   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      - name: Use private signing key (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "HAPPYNESS_KEYSTORE=$RUNNER_TEMP/release.jks"
            echo "HAPPYNESS_KEYSTORE_PASSWORD=$KS_PASS"
            echo "HAPPYNESS_KEY_ALIAS=$KEY_ALIAS"
            echo "HAPPYNESS_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          # Optional repository variables (Settings → Secrets and variables → Actions → Variables)
          HAPPYNESS_SERVER_URL: ${{ vars.HAPPYNESS_SERVER_URL }}
          HAPPYNESS_STORE_SAFE: ${{ vars.HAPPYNESS_STORE_SAFE }}
          HAPPYNESS_CONTACT_EMAIL: ${{ vars.HAPPYNESS_CONTACT_EMAIL }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Name the APK
        id: apk
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Happyness-${VERSION}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/Happyness-${VERSION}.aab"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "file=dist/Happyness-${VERSION}.apk" >> "$GITHUB_OUTPUT"
          echo "aab=dist/Happyness-${VERSION}.aab" >> "$GITHUB_OUTPUT"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: Happyness-${{ steps.apk.outputs.version }}
          path: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.aab }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.apk.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Happyness for Android ${{ steps.apk.outputs.version }}
          make_latest: true
          files: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.aab }}
          body: |
            🌻 **Happyness for Android**: only happy news and kind stories.

            **Install on your phone**
            1. Open this page on your Android phone and tap **Happyness-${{ steps.apk.outputs.version }}.apk** below.
            2. When asked, allow your browser to *install unknown apps*.
            3. Tap **Install**, then open Happyness from your home screen.

            If installing over an older version fails, uninstall the old one first (see README → Signing).

            The `.aab` file is for uploading to Google Play Console (see store/PLAY_STORE.md).
